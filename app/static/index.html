<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snipr</title>
  <style>body { font: 1rem system-ui; max-width: 36rem; margin: 4rem auto; padding: 0 1rem }</style>
</head>
<body>
  <h1>snipr</h1>
  <form id="form">
    <label for="url">URL to shorten</label>
    <input id="url" type="url" required placeholder="https://example.com">
    <button>Shorten</button>
  </form>
  <p id="result" role="status"></p>
  <script>
    const result = document.getElementById("result");
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const response = await fetch("/api/links", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("url").value }),
        });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const link = document.createElement("a");
        link.href = link.textContent = (await response.json()).short_url;
        result.replaceChildren(link);
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
