apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snipr-postgres
  labels: {{- include "snipr.labels" . | nindent 4 }}
    app.kubernetes.io/name: snipr-postgres
spec:
  serviceName: snipr-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snipr-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snipr-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # the postgres user in the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            {{- include "snipr.secretEnv" . | nindent 12 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe: # generous, so a slow recovery is not killed mid-way
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "snipr.restricted" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  # Not deleted by "helm uninstall". Deleting this PVC deletes the database.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
