# Public HTTP only (no TLS): fine for a demo, not for real credentials.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snipr
  labels: {{- include "snipr.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: snipr, port: { name: http } }
---
# /metrics is for Prometheus inside the cluster, which uses the Service directly.
# This more specific rule wins for /metrics and allows only localhost, so the
# internet gets 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: snipr-internal-only
  labels: {{- include "snipr.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snipr-metrics-blocked
  labels: {{- include "snipr.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-snipr-internal-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service: { name: snipr, port: { name: http } }
