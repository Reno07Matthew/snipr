# Required at install time (kept out of Git):
#   --set image.repository=<account>.dkr.ecr.ap-south-1.amazonaws.com/snipr
#   --set image.tag=<full git SHA>
#   --set baseUrl=http://<public IP>
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecret: ecr-creds # created by scripts/ecr-refresh.sh

baseUrl: ""

# Created once on the node, outside Helm, so the password never passes through
# CD or Git. Keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
existingSecret: snipr-db

replicas: 2
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }

readinessPath: /does-not-exist # DEMO ONLY: breaks readiness to show rollback; reverted next commit

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpuPercent: 70

postgres:
  image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
