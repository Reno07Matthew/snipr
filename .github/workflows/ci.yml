name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f app/Dockerfile -t snipr:ci .
      # A tarball, so the scanner never gets access to the Docker socket.
      - run: mkdir scan && docker save snipr:ci -o scan/image.tar
      - name: Trivy report (all severities)
        run: >-
          docker run --rm -v "$PWD/scan:/scan" "$TRIVY" image --input /scan/image.tar
          --scanners vuln --cache-dir /scan/cache --format json -o /scan/trivy-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: scan/trivy-report.json
          if-no-files-found: error
      - name: Trivy gate (fail on CRITICAL)
        run: >-
          docker run --rm -v "$PWD/scan:/scan" "$TRIVY" image --input /scan/image.tar
          --scanners vuln --cache-dir /scan/cache --skip-db-update --severity CRITICAL --exit-code 1

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
          persist-credentials: false
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
