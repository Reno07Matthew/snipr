# kube-prometheus-stack, trimmed for one node. Installed with: make monitoring
# Nothing here is public: there is no Ingress. Reach Grafana through an SSH tunnel.

# k3s runs these components inside one process; their usual scrape targets do
# not exist, so they would only produce "down" targets.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
coreDns: { enabled: false }

# The default rules and dashboards are large and need many recording rules.
# Slim version: only the snipr dashboard and alerts.
defaultRules: { create: false }

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 2GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Pick up ServiceMonitors and rules from any namespace (the snipr chart's).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 3Gi } }

alertmanager:
  alertmanagerSpec:
    # Created by the owner on the node; mounted at
    # /etc/alertmanager/secrets/alertmanager-discord/webhook-url
    secrets: [alertmanager-discord]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 4h
      # The chart's default child routes point at a "null" receiver (for its
      # Watchdog alert); with our own receivers list that receiver no longer
      # exists and the operator rejects the config. Clear them.
      routes: []
    receivers:
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true

grafana:
  admin:
    existingSecret: grafana-admin # generated on the node; never the chart default
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  persistence: { enabled: false } # dashboards come from ConfigMaps
  resources:
    requests: { cpu: 25m, memory: 256Mi }
    limits: { memory: 512Mi } # 256Mi was OOMKilled at startup
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

prometheusOperator:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }
